<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#1c140d"/>

  <!-- Input -> Hidden edges -->
  <line x1="7" y1="10" x2="16" y2="6"  stroke="#cbe86b" stroke-width="0.9" opacity="0.30"/>
  <line x1="7" y1="10" x2="16" y2="16" stroke="#cbe86b" stroke-width="0.9" opacity="0.30"/>
  <line x1="7" y1="10" x2="16" y2="26" stroke="#cbe86b" stroke-width="0.9" opacity="0.30"/>
  <line x1="7" y1="22" x2="16" y2="6"  stroke="#cbe86b" stroke-width="0.9" opacity="0.30"/>
  <line x1="7" y1="22" x2="16" y2="16" stroke="#cbe86b" stroke-width="0.9" opacity="0.30"/>
  <line x1="7" y1="22" x2="16" y2="26" stroke="#cbe86b" stroke-width="0.9" opacity="0.30"/>

  <!-- Hidden -> Output edges -->
  <line x1="16" y1="6"  x2="25" y2="16" stroke="#cbe86b" stroke-width="0.9" opacity="0.50"/>
  <line x1="16" y1="16" x2="25" y2="16" stroke="#cbe86b" stroke-width="0.9" opacity="0.50"/>
  <line x1="16" y1="26" x2="25" y2="16" stroke="#cbe86b" stroke-width="0.9" opacity="0.50"/>

  <!-- Input nodes (lime) -->
  <circle cx="7"  cy="10" r="2.6" fill="#cbe86b"/>
  <circle cx="7"  cy="22" r="2.6" fill="#cbe86b"/>

  <!-- Hidden nodes (teal) -->
  <circle cx="16" cy="6"  r="2.6" fill="#78d4a8"/>
  <circle cx="16" cy="16" r="2.6" fill="#78d4a8"/>
  <circle cx="16" cy="26" r="2.6" fill="#78d4a8"/>

  <!-- Output node (lime, slightly brighter ring) -->
  <circle cx="25" cy="16" r="2.6" fill="#cbe86b"/>
</svg>
