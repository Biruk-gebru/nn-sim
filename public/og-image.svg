<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Left-to-right fade so the network illustration doesn't obscure text -->
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1c140d" stop-opacity="1"/>
      <stop offset="44%"  stop-color="#1c140d" stop-opacity="1"/>
      <stop offset="62%"  stop-color="#1c140d" stop-opacity="0.72"/>
      <stop offset="84%"  stop-color="#1c140d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1c140d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1c140d"/>

  <!-- Neural network illustration — right side, very low opacity -->
  <!-- 3-5-5-3 architecture, x: 600→783→967→1150, y range: 50→580 -->
  <g opacity="0.08" stroke="#f2e9e1" stroke-width="0.9" fill="none">
    <!-- L0 (x=600: y=183,315,448) → L1 (x=783: y=138,227,315,403,492) -->
    <line x1="600" y1="183" x2="783" y2="138"/><line x1="600" y1="183" x2="783" y2="227"/>
    <line x1="600" y1="183" x2="783" y2="315"/><line x1="600" y1="183" x2="783" y2="403"/>
    <line x1="600" y1="183" x2="783" y2="492"/><line x1="600" y1="315" x2="783" y2="138"/>
    <line x1="600" y1="315" x2="783" y2="227"/><line x1="600" y1="315" x2="783" y2="315"/>
    <line x1="600" y1="315" x2="783" y2="403"/><line x1="600" y1="315" x2="783" y2="492"/>
    <line x1="600" y1="448" x2="783" y2="138"/><line x1="600" y1="448" x2="783" y2="227"/>
    <line x1="600" y1="448" x2="783" y2="315"/><line x1="600" y1="448" x2="783" y2="403"/>
    <line x1="600" y1="448" x2="783" y2="492"/>
    <!-- L1 (x=783) → L2 (x=967: same y) -->
    <line x1="783" y1="138" x2="967" y2="138"/><line x1="783" y1="138" x2="967" y2="227"/>
    <line x1="783" y1="138" x2="967" y2="315"/><line x1="783" y1="138" x2="967" y2="403"/>
    <line x1="783" y1="138" x2="967" y2="492"/><line x1="783" y1="227" x2="967" y2="138"/>
    <line x1="783" y1="227" x2="967" y2="227"/><line x1="783" y1="227" x2="967" y2="315"/>
    <line x1="783" y1="227" x2="967" y2="403"/><line x1="783" y1="227" x2="967" y2="492"/>
    <line x1="783" y1="315" x2="967" y2="138"/><line x1="783" y1="315" x2="967" y2="227"/>
    <line x1="783" y1="315" x2="967" y2="315"/><line x1="783" y1="315" x2="967" y2="403"/>
    <line x1="783" y1="315" x2="967" y2="492"/><line x1="783" y1="403" x2="967" y2="138"/>
    <line x1="783" y1="403" x2="967" y2="227"/><line x1="783" y1="403" x2="967" y2="315"/>
    <line x1="783" y1="403" x2="967" y2="403"/><line x1="783" y1="403" x2="967" y2="492"/>
    <line x1="783" y1="492" x2="967" y2="138"/><line x1="783" y1="492" x2="967" y2="227"/>
    <line x1="783" y1="492" x2="967" y2="315"/><line x1="783" y1="492" x2="967" y2="403"/>
    <line x1="783" y1="492" x2="967" y2="492"/>
    <!-- L2 (x=967) → L3 (x=1150: y=183,315,448) -->
    <line x1="967" y1="138" x2="1150" y2="183"/><line x1="967" y1="138" x2="1150" y2="315"/>
    <line x1="967" y1="138" x2="1150" y2="448"/><line x1="967" y1="227" x2="1150" y2="183"/>
    <line x1="967" y1="227" x2="1150" y2="315"/><line x1="967" y1="227" x2="1150" y2="448"/>
    <line x1="967" y1="315" x2="1150" y2="183"/><line x1="967" y1="315" x2="1150" y2="315"/>
    <line x1="967" y1="315" x2="1150" y2="448"/><line x1="967" y1="403" x2="1150" y2="183"/>
    <line x1="967" y1="403" x2="1150" y2="315"/><line x1="967" y1="403" x2="1150" y2="448"/>
    <line x1="967" y1="492" x2="1150" y2="183"/><line x1="967" y1="492" x2="1150" y2="315"/>
    <line x1="967" y1="492" x2="1150" y2="448"/>
  </g>
  <!-- Nodes -->
  <g opacity="0.08">
    <circle cx="600"  cy="183" r="9" fill="#cbe86b"/>
    <circle cx="600"  cy="315" r="9" fill="#cbe86b"/>
    <circle cx="600"  cy="448" r="9" fill="#cbe86b"/>
    <circle cx="783"  cy="138" r="9" fill="#78d4a8"/>
    <circle cx="783"  cy="227" r="9" fill="#78d4a8"/>
    <circle cx="783"  cy="315" r="9" fill="#78d4a8"/>
    <circle cx="783"  cy="403" r="9" fill="#78d4a8"/>
    <circle cx="783"  cy="492" r="9" fill="#78d4a8"/>
    <circle cx="967"  cy="138" r="9" fill="#78d4a8"/>
    <circle cx="967"  cy="227" r="9" fill="#78d4a8"/>
    <circle cx="967"  cy="315" r="9" fill="#78d4a8"/>
    <circle cx="967"  cy="403" r="9" fill="#78d4a8"/>
    <circle cx="967"  cy="492" r="9" fill="#78d4a8"/>
    <circle cx="1150" cy="183" r="9" fill="#cbe86b"/>
    <circle cx="1150" cy="315" r="9" fill="#cbe86b"/>
    <circle cx="1150" cy="448" r="9" fill="#cbe86b"/>
  </g>

  <!-- Gradient overlay — keeps left text area clean -->
  <rect width="1200" height="630" fill="url(#fade)"/>

  <!-- Bottom lime accent bar -->
  <rect x="0" y="611" width="1200" height="19" fill="#cbe86b"/>

  <!-- Left accent bar -->
  <rect x="76" y="160" width="3" height="168" fill="#cbe86b" rx="1.5" opacity="0.5"/>

  <!-- Domain -->
  <text x="100" y="102"
    font-family="ui-monospace,'Courier New',monospace"
    font-size="17" fill="#6a5440">
    mlplayground.birukjember.tech
  </text>

  <!-- Main title -->
  <text x="100" y="207"
    font-family="'Helvetica Neue',Arial,'Liberation Sans',sans-serif"
    font-size="80" font-weight="800" fill="#f2e9e1"
    letter-spacing="-2">
    ML Playground
  </text>

  <!-- Tagline -->
  <text x="100" y="268"
    font-family="'Helvetica Neue',Arial,sans-serif"
    font-size="30" font-weight="500" fill="#cbe86b">
    Learn ML by watching it work.
  </text>

  <!-- Description -->
  <text x="100" y="316"
    font-family="'Helvetica Neue',Arial,sans-serif"
    font-size="19" fill="#9a7e60">
    6 interactive demos. No installation. Runs entirely in the browser.
  </text>

  <!-- Module row 1 -->
  <circle cx="100" cy="396" r="6" fill="#cbe86b"/>
  <text x="116" y="401" font-family="ui-monospace,'Courier New',monospace" font-size="15" fill="#b8a882">Neural Networks</text>
  <circle cx="282" cy="396" r="6" fill="#78d4a8"/>
  <text x="298" y="401" font-family="ui-monospace,'Courier New',monospace" font-size="15" fill="#b8a882">Tokenizer</text>
  <circle cx="404" cy="396" r="6" fill="#6aace0"/>
  <text x="420" y="401" font-family="ui-monospace,'Courier New',monospace" font-size="15" fill="#b8a882">Embeddings</text>

  <!-- Module row 2 -->
  <circle cx="100" cy="433" r="6" fill="#d49a3a"/>
  <text x="116" y="438" font-family="ui-monospace,'Courier New',monospace" font-size="15" fill="#b8a882">Regression</text>
  <circle cx="228" cy="433" r="6" fill="#e0623a"/>
  <text x="244" y="438" font-family="ui-monospace,'Courier New',monospace" font-size="15" fill="#b8a882">Activations</text>
  <circle cx="370" cy="433" r="6" fill="#a0c84a"/>
  <text x="386" y="438" font-family="ui-monospace,'Courier New',monospace" font-size="15" fill="#b8a882">Attention</text>
</svg>
